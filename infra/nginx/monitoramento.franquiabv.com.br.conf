# /etc/nginx/sites-available/monitoramento.franquiabv.com.br
#
# Vhost dedicado do VIPCam. Coexiste com outros sites do VPS sem
# colidir — usa apenas a porta 80/443 do server_name específico.
#
# Mapeamento:
#   monitoramento.franquiabv.com.br/        → 127.0.0.1:3035 (Next.js web)
#   monitoramento.franquiabv.com.br/api/*   → 127.0.0.1:4001 (Bun+Hono edge)
#
# As portas internas (3035, 4001) são bound em 127.0.0.1 nos systemd units,
# então não estão acessíveis externamente — só via este vhost.

# Redirect HTTP → HTTPS (após cert)
server {
    listen 80;
    listen [::]:80;
    server_name monitoramento.franquiabv.com.br;

    # ACME challenge para Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sintaxe válida em nginx 1.18 (Ubuntu 22.04) — o `http2` aqui é inócuo
    # p/ o /live: o socket :443 é compartilhado com outros vhosts do VPS
    # que já forçam HTTP/2, então o browser sempre negocia H2 neste host.
    #
    # CONSTRAINT CONHECIDA (provado 2026-05-19, ver
    # docs/superpowers/specs/2026-05-19-live-resilience-*): nginx 1.18 tem
    # defeito no proxy HTTP/2 de respostas de streaming long-lived — reseta
    # o SSE /api/events/stream com RST_STREAM(INTERNAL_ERROR) ~4s após os
    # primeiros bytes (browser: ERR_HTTP2_PROTOCOL_ERROR em loop). Mesmo
    # handler/upstream sobre HTTP/1.1 funciona; só H2 quebra; independe de
    # proxy_buffering; upstream Bun manda Transfer-Encoding: chunked
    # (bem-formado). Causa-raiz = nginx 1.18; corrigido em nginx >= 1.25.
    #
    # Upgrade do nginx (fix raiz) ABANDONADO neste VPS: ppa:ondrej/nginx
    # não resolve e o pacote nginx.org sobrescreve o nginx.conf (perde o
    # layout sites-enabled → outage; rollback feito em 2026-05-19).
    # Mitigação adotada: o /live usa fallback de polling (não depende de
    # SSE/H2). Reavaliar SSE só se o nginx for modernizado por outro meio
    # (ex: nginx containerizado dedicado). NÃO trocar p/ a diretiva
    # `http2 on;` enquanto o VPS estiver em nginx 1.18 (quebra nginx -t).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoramento.franquiabv.com.br;

    # TLS — preencher após `certbot --nginx -d monitoramento.franquiabv.com.br`
    ssl_certificate     /etc/letsencrypt/live/monitoramento.franquiabv.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoramento.franquiabv.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload de snapshots de face pode chegar a ~1MB; deixa com folga
    client_max_body_size 10M;

    # Logs separados (não polui logs gerais do nginx)
    access_log /var/log/nginx/vipcam.access.log;
    error_log  /var/log/nginx/vipcam.error.log warn;

    # ----- Backend (edge) -----
    # IMPORTANTE: /api/discovery/* fica restrito a redes internas até que
    # o middleware X-API-Key seja implementado (planejado para Onda 2+).
    # Discovery dispara captura de até 60min na câmera — endpoint não pode
    # ficar exposto sem auth na internet pública.
    location /api/discovery/ {
        # LAN interna + localhost
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Discovery probe pode rodar 60min — buffer off, timeouts altos
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE — Live feed (Onda 3). MUST vir antes de `location /api/`.
    # Exact-match `=` tem prioridade sobre prefixo e ignora query string,
    # então casa /api/events/stream?api_key=... .
    #
    # Bug 2026-05-15: o bloco /api/ genérico força `Connection "upgrade"`
    # (config de WebSocket). SSE é um GET HTTP normal SEM header Upgrade;
    # mandar `Connection: upgrade` numa conexão long-lived não-WS faz o
    # nginx/upstream tratarem como upgrade falho → 502 Bad Gateway em loop.
    # REST curto tolera; só o stream SSE quebra. Aqui Connection vazio +
    # buffering/cache off + read timeout longo (heartbeat 15s do edge
    # mantém vivo; damos folga).
    location = /api/events/stream {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /api/* (todos os outros) → Bun+Hono na 4001
    # /api/health, /api/persons, /api/erp/*, etc.
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (real-time push em Onda 3+)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Discovery probe pode demorar (10min de captura) — buffer off + read longo
        proxy_buffering    off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Onda 7 §2.3: snapshots JPEG servidos pelo edge (vipcam-edge, port 4001).
    # Route /snapshots/:date/:filename com regex anti-traversal por segmento.
    # GETs curtos cacheados (cache-control vem do edge). Sem WebSocket; auth
    # pública (nginx restringe LAN se necessário via allow/deny acima).
    location /snapshots/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- Frontend (web Next.js) -----
    # Tudo que não é /api/ vai pro Next.js na 3035
    location / {
        proxy_pass http://127.0.0.1:3035;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR (em dev) usa WebSocket; harmless em prod
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Cache estático do Next (build artifacts) — long cache, immutable
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3035;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
